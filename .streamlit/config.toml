[theme]
# Editorial-warm light palette — stone neutrals, one terracotta accent.
# Hierarchy from weight, whitespace and a single restrained accent.
base = "light"
primaryColor = "#C2541B"
backgroundColor = "#FCFBF9"
secondaryBackgroundColor = "#F5F3EF"
textColor = "#1C1A17"
font = "sans serif"

[server]
port = 8501
enableStaticServing = true

[browser]
gatherUsageStats = false
